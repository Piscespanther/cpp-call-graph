<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      导出 PNG 要在 webview 里把序列化后的 SVG 交给 `new Image()` 栅格化，所以 CSP 必须
      放行图像来源：`img-src blob: data:`。`default-src 'none'` 会让 img-src 回退成 none，
      那样图像加载会被**静默**拦下（表现是导出没有任何反应）。

      两条来源各有用途，都不能去掉：
        - `blob:` 是**主路径**（`URL.createObjectURL(new Blob([...]))`）。原因：Chromium
          对 URL 长度有硬上限 **2 MB**（`url::kMaxURLChars = 2 * 1024 * 1024`），而大图的
          SVG 序列化后就是 2 MB 量级（真机实测 276 个节点 = 2154007 字节），base64 之后
          约 2.87 MB —— 超长 data URL 会被截断/判为非法，`new Image()` 直接走 `onerror`，
          小图却一切正常。blob URL 只是一个短字符串，不受该上限约束。
        - `data:` 保留作**后备**：blob 加载失败时用 `data:image/svg+xml;base64,…` 再试一次
          （小图仍可成功，也覆盖 `createObjectURL` 不可用的环境）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src blob: data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';"
    />
    <title>调用关系图</title>
  </head>

      <!--
        搜索栏：固定在这一小栏的**最右侧**（CSS 用 margin-left:auto 推到行尾）。
        按需求：搜索当前标签的**元素名**（下面的两个开关可把路径也纳入搜索），命中方框黄色高亮，
        上下箭头在多个命中间跳；五个开关分别是「区分大小写 / 全字 / 正则 / 同时搜显示的路径 /
        同时搜完整路径」（后两个是用户 2026-10-15 要求新增的搜索范围开关）。

        同一栏右侧还有**临时路径过滤**的输入框（用户 2026-10-15 要求）：它按路径把命中的
        方框（连同其子树）从所有标签里隐藏，与搜索互不影响，也不写入任何设置；清空即恢复。

        这里刻意全部用文字与 CSS，不加内联图标轮廓：
        图标轮廓数量是第三方署名清单与校验脚本都盯着的数字，加一个就要同步改两处。
      -->
      <div id="search" class="search">
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="搜索元素名"
          title="搜索当前标签的元素名（Enter 下一个，Shift+Enter 上一个，Esc 清空）"
          spellcheck="false"
          autocomplete="off"
        />
        <button id="btn-search-case" class="search-toggle" type="button" title="区分大小写" aria-label="区分大小写" aria-pressed="false">Aa</button>
        <button id="btn-search-word" class="search-toggle" type="button" title="全字匹配" aria-label="全字匹配" aria-pressed="false">全字</button>
        <button id="btn-search-regex" class="search-toggle" type="button" title="正则匹配" aria-label="正则匹配" aria-pressed="false">.*</button>
        <button id="btn-search-path" class="search-toggle" type="button" title="同时搜索方框里显示的路径（随路径显示设置变化）" aria-label="同时搜索显示的路径" aria-pressed="false">路径</button>
        <button id="btn-search-full" class="search-toggle" type="button" title="同时搜索完整文件路径（不受路径显示设置影响）" aria-label="同时搜索完整路径" aria-pressed="false">全路径</button>
        <span id="search-count" class="search-count" role="status" aria-live="polite"></span>
        <button id="btn-search-prev" class="search-step" type="button" title="上一个命中（Shift+Enter）">↑</button>
        <button id="btn-search-next" class="search-step" type="button" title="下一个命中（Enter）">↓</button>
        <!--
          临时路径过滤。整段用 `<span>` 包一层（而不是再嵌一个 div）：校验脚本按 #search 外层
          div 的**结束标签**截取这一段，里面若再出现一个 div 的结束标签，抓取会提前截断。
          查询是**子串 + 通配**（`*` 段内任意长、`?` 单字符、两个星号后接斜杠表示任意层），
          匹配对象是完整（相对工作区）路径；「已隐藏 N 个」由宿主算好后随 payload 下发。
        -->
        <span id="path-filter" class="path-filter">
          <input
            id="path-filter-input"
            class="search-input path-filter-input"
            type="text"
            placeholder="临时过滤路径…"
            title="临时过滤：路径命中该查询的方框（连同其子树）在所有标签里都不显示；不写入设置，清空后立即恢复"
            spellcheck="false"
            autocomplete="off"
          />
          <span id="path-filter-count" class="search-count path-filter-count" role="status" aria-live="polite"></span>
        </span>
      </div>
    </div>
    <div id="tabs" class="tabs" role="tablist"></div>
    <!--
      标签栏的自有右键菜单（用户 2026-10-14 要求）。VS Code 给 webview 的默认菜单（剪切/复制/粘贴）
      无法由扩展扩展，因此自建一套；复用 `#box-menu` 的样式类，不新增 CSS。
      「关闭所有」与工具栏「关闭全部调用关系标签」同语义（含收起面板视图），避免两处语义分叉。
    -->
    <div id="tab-menu" class="box-menu" hidden role="menu">
      <button type="button" role="menuitem" data-action="copyTabName"><span>复制标签名</span></button>
      <button type="button" role="menuitem" data-action="closeSelf"><span>关闭</span></button>
      <button type="button" role="menuitem" data-action="closeOthers"><span>关闭其他</span></button>
      <button type="button" role="menuitem" data-action="closeLeft"><span>关闭左侧</span></button>
      <button type="button" role="menuitem" data-action="closeRight"><span>关闭右侧</span></button>
      <button type="button" role="menuitem" data-action="closeAll"><span>关闭所有</span></button>
    </div>
    <!--
      工具栏「导出」按钮的下拉菜单（用户本轮要求）。复用 `#box-menu` 的样式类，
      **不新增 CSS**；`data-format` 是稳定取值，webview 与断言都按它取格式。
      放在工具栏按钮下方（贴着按钮），点其它地方或按 Esc 收起。
    -->
    <div id="export-menu" class="box-menu" hidden role="menu">
      <button type="button" role="menuitem" data-format="png"><span>导出图片（PNG，2×）</span></button>
      <button type="button" role="menuitem" data-format="svg"><span>导出矢量图（SVG）</span></button>
      <button type="button" role="menuitem" data-format="md-tree"><span>导出 Markdown（结构树）</span></button>
      <button type="button" role="menuitem" data-format="md-table"><span>导出 Markdown（表格）</span></button>
      <button type="button" role="menuitem" data-format="json"><span>导出 JSON（数据）</span></button>
    </div>
    <!--
      节点总数上限提示：到上限时两个展开按钮会被置为禁用（它们那时必然无效），
      这里显示一行说明与两条出路。用内联文字而不是右下角弹窗 —— 本项目明确不要打扰式提示。
      默认 `hidden`，由 `applyCapacityState()` 按会话数据开关。
    -->
    <div id="capacity-hint" class="capacity-hint" role="status" aria-live="polite" hidden></div>
    <!--
      `#stage` 是**不滚动**的外层：画布在里面滚动，加载遮罩挂在 stage 上。
      遮罩若挂在 `#canvas` 里（滚动容器），内容一滚动它就会跟着滚出可视区，
      正中也只是「内容盒」的正中，而不是眼前这块面板的正中。
    -->
    <div id="stage" class="stage">
      <div id="canvas" class="canvas">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
            </marker>
          </defs>
          <g id="viewport">
            <g id="edges"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <span id="summary" class="summary"></span>
        <div id="empty" class="empty">
          <p>没有打开的调用关系标签。</p>
          <p class="hint">在 C/C++ 文件中右键函数，选择「被调用关系图」或「调用关系图」。</p>
        </div>
      </div>
      <!--
        加载遮罩：解析较慢的查询（宏、结构体、变量这类要走引用查找的符号）时，
        在画布正中显示转圈与「取消」按钮，并把背景模糊掉。
        延迟一小会儿才出现，避免快查询闪一下。
      -->
      <div id="busy" class="busy" hidden role="status" aria-live="polite">
        <div class="busy-card">
          <span class="busy-spinner" aria-hidden="true"></span>
          <p id="busy-label" class="busy-label">正在解析…</p>
          <button id="btn-busy-cancel" type="button" class="busy-cancel">取消</button>
        </div>
      </div>
    </div>
