      <!--
        搜索栏：固定在这一小栏的**最右侧**（CSS 用 margin-left:auto 推到行尾）。
        按需求：只搜当前标签的**元素名**，命中方框黄色高亮，上下箭头在多个命中间跳；
        三个开关分别是「区分大小写 / 全字 / 正则」。

        这里刻意全部用文字与 CSS，不加内联图标轮廓：
        图标轮廓数量是第三方署名清单与校验脚本都盯着的数字，加一个就要同步改两处。
      -->
      <div id="search" class="search">
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="搜索元素名"
          title="搜索当前标签的元素名（Enter 下一个，Shift+Enter 上一个，Esc 清空）"
          spellcheck="false"
          autocomplete="off"
        />
        <button id="btn-search-case" class="search-toggle" type="button" title="区分大小写">Aa</button>
        <button id="btn-search-word" class="search-toggle" type="button" title="全字匹配（仅匹配完整单词）">全字</button>
        <button id="btn-search-regex" class="search-toggle" type="button" title="正则匹配">.*</button>
        <span id="search-count" class="search-count"></span>
        <button id="btn-search-prev" class="search-step" type="button" title="上一个命中（Shift+Enter）">↑</button>
        <button id="btn-search-next" class="search-step" type="button" title="下一个命中（Enter）">↓</button>
      </div>
    </div>
    <div id="tabs" class="tabs" role="tablist"></div>
    <!--
      `#stage` 是**不滚动**的外层：画布在里面滚动，加载遮罩挂在 stage 上。
      遮罩若挂在 `#canvas` 里（滚动容器），内容一滚动它就会跟着滚出可视区，
      正中也只是「内容盒」的正中，而不是眼前这块面板的正中。
    -->
    <div id="stage" class="stage">
      <div id="canvas" class="canvas">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
            </marker>
          </defs>
          <g id="viewport">
            <g id="edges"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <span id="summary" class="summary"></span>
        <div id="empty" class="empty">
          <p>没有打开的调用关系标签。</p>
          <p class="hint">在 C/C++ 文件中右键函数，选择「被调用关系图」或「调用关系图」。</p>
        </div>
      </div>
      <!--
        加载遮罩：解析较慢的查询（宏、结构体、变量这类要走引用查找的符号）时，
        在画布正中显示转圈与「取消」按钮，并把背景模糊掉。
        延迟一小会儿才出现，避免快查询闪一下。
      -->
      <div id="busy" class="busy" hidden role="status" aria-live="polite">
        <div class="busy-card">
          <span class="busy-spinner" aria-hidden="true"></span>
          <p id="busy-label" class="busy-label">正在解析…</p>
          <button id="btn-busy-cancel" type="button" class="busy-cancel">取消</button>
        </div>
      </div>
    </div>
    <!--
      方框的右键菜单。webview 中无法使用 VS Code 原生命令面板样式的菜单，
      所以自己画一个：绝对定位在鼠标位置，点其它地方或按 Esc 就关掉。
    -->
    <div id="box-menu" class="box-menu" hidden role="menu">
